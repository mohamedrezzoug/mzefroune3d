<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امزفرون 3D</title>
<meta name="description" content="Mzefroune 3D explorer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D scene, quiet dark glass panels pinned to corners, one Rif-blue accent */
:root {
  --panel: rgba(16, 21, 24, 0.80);
  --panel-line: rgba(255, 255, 255, 0.10);
  --ink: #f1eee6;
  --ink-dim: #a9b0ad;
  --accent: #6fa8dc;      /* chaux bleue des douars du Rif */
  --olive: #b9b06a;
  --sky: #b9cfe0;
  --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font); overflow: hidden; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: fixed; z-index: 5; direction: rtl; }
.panel {
  background: var(--panel); border: 1px solid var(--panel-line);
  border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#title {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  padding: 14px 16px; max-width: min(320px, calc(100vw - 32px));
  display: grid; gap: 10px;
}
#title h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0; line-height: 1.1; }
#title h1 span { color: var(--accent); }
#title .sub { margin: 0; font-size: 12.5px; color: var(--ink-dim); }
.readout { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.readout dt { color: var(--ink-dim); }
.readout dd { margin: 0; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.sources { display: grid; gap: 4px; font-size: 11.5px; border-top: 1px solid var(--panel-line); padding-top: 8px; }
.src { display: flex; gap: 8px; align-items: baseline; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-dim); transform: translateY(-1px); }
.dot.real { background: #7cc58a; }
.dot.approx { background: #e0a64e; }
.dot.off { background: #c76a5f; }

#controls {
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  padding: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
  max-width: calc(100vw - 32px);
}
.seg { display: flex; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 3px; gap: 3px; }
button {
  font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 0;
  padding: 8px 14px; border-radius: 6px; cursor: pointer;
}
button:hover { background: rgba(255,255,255,0.08); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #0d1a26; font-weight: 600; }
#help { font-size: 12px; color: var(--ink-dim); padding-inline: 6px; }

#notice {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  padding: 12px 14px; max-width: min(300px, calc(100vw - 32px)); font-size: 12.5px; line-height: 1.6;
  border-color: rgba(224, 166, 78, 0.45);
}
#notice strong { color: #e8b866; font-weight: 600; }
#notice button { padding: 2px 8px; font-size: 12px; color: var(--ink-dim); margin-top: 4px; }

#loader {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 40%, #24313a, #11171b); direction: rtl;
}
#loader .box { display: grid; gap: 14px; width: min(320px, calc(100vw - 32px)); }
#loader h2 { margin: 0; font-size: 20px; font-weight: 600; }
#loader ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13.5px; color: var(--ink-dim); }
#loader li.done { color: var(--ink); }
#loader li.done::before { content: "✓ "; color: #7cc58a; }
#loader li.now::before { content: "… "; color: var(--accent); }

#joy {
  position: fixed; z-index: 6; left: 24px; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(16,21,24,0.45); border: 1px solid var(--panel-line); touch-action: none;
}
#joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
  border-radius: 50%; background: rgba(111,168,220,0.75); }

#credit {
  position: fixed; z-index: 4; left: 8px; bottom: calc(4px + env(safe-area-inset-bottom, 0px));
  font-size: 10px; color: rgba(20,30,35,0.75); direction: ltr;
}
#credit a { color: inherit; }

@media (max-width: 640px) {
  #title { padding: 10px 12px; gap: 6px; }
  #title h1 { font-size: 18px; }
  .sources { display: none; }
  #notice { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); right: 16px; left: 16px; max-width: none; }
  #help { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<canvas id="scene" aria-label="مشهد ثلاثي الأبعاد ديال منطقة امزفرون"></canvas>

<div id="loader">
  <div class="box">
    <h2>كنوجدو امزفرون…</h2>
    <ol id="steps">
      <li id="st-terrain" class="now">التضاريس (ارتفاعات الأرض)</li>
      <li id="st-image">الصور الجوية</li>

    </ol>

    <p style="margin:0;font-size:11px;color:var(--ink-dim);direction:ltr">v4</p>
  </div>
</div>

<section id="title" class="hud panel">
  <div>
    <h1>امزفرون <span>3D</span></h1>
    <p class="sub">جماعة امزفرون · إقليم وزان</p>
  </div>
  <dl class="readout">
    <dt>الإحداثيات</dt><dd id="r-coord">—</dd>
    <dt>الارتفاع</dt><dd id="r-alt">—</dd>

  </dl>
  <div class="sources" id="sources"></div>
</section>

<aside id="notice" class="hud panel" hidden></aside>

<nav id="controls" class="hud panel" aria-label="التحكم">
  <div class="seg" role="group" aria-label="طريقة التنقل">
    <button id="b-fly" aria-pressed="true">طيران</button>
    <button id="b-walk" aria-pressed="false">مشي</button>
  </div>
  <button id="b-home">رجع للمركز</button>
  <span id="help"></span>
</nav>

<div id="joy" hidden><i></i></div>

<div id="credit"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- Géographie ---------- */
const CENTER = { lat: 34.8423, lon: -5.6841 };   // centre de Mzefroune
const Z = 13, N = 3;                              // 3×3 tuiles terrain ≈ 12 km
const n = 2 ** Z;
const rad = d => d * Math.PI / 180;
const mercY = lat => (1 - Math.log(Math.tan(rad(lat)) + 1 / Math.cos(rad(lat))) / Math.PI) / 2;
const cTX = (CENTER.lon + 180) / 360 * n, cTY = mercY(CENTER.lat) * n;
const x0 = Math.floor(cTX) - 1, y0 = Math.floor(cTY) - 1;
const tileM = 40075016.686 * Math.cos(rad(CENTER.lat)) / n;
const SIZE = N * tileM, HALF = SIZE / 2;
const tile2lon = x => x / n * 360 - 180;
const tile2lat = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;
const BBOX = { w: tile2lon(x0), e: tile2lon(x0 + N), n: tile2lat(y0), s: tile2lat(y0 + N) };
function geoToWorld(lat, lon) {
  const tx = (lon + 180) / 360 * n - x0, ty = mercY(lat) * n - y0;
  return [tx * tileM - HALF, ty * tileM - HALF];
}
function worldToGeo(x, z) {
  return { lon: tile2lon(x0 + (x + HALF) / tileM), lat: tile2lat(y0 + (z + HALF) / tileM) };
}
const [SPAWN_X, SPAWN_Z] = geoToWorld(CENTER.lat, CENTER.lon);

/* ---------- Utilitaires ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261009);
function hash(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function loadImg(url, ms = 9000) {
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    const t = setTimeout(() => { im.src = ''; rej(new Error('timeout')); }, ms);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); rej(new Error('blocked')); };
    im.src = url;
  });
}
function step(id, state) { const el = document.getElementById(id); if (!el) return; el.className = state; }

const status = { terrain: 'approx', image: 'approx', osm: 'off', roads: 0, houses: 0 };

/* ---------- 1. Terrain ---------- */
const RAW = N * 256;
let raw = new Float32Array(RAW * RAW);
async function loadTerrain() {
  const cv = document.createElement('canvas'); cv.width = cv.height = RAW;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const jobs = [];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const url = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${Z}/${x0 + i}/${y0 + j}.png`;
    jobs.push(loadImg(url).then(im => ctx.drawImage(im, i * 256, j * 256)));
  }
  await Promise.all(jobs);
  const d = ctx.getImageData(0, 0, RAW, RAW).data;
  for (let k = 0; k < RAW * RAW; k++) raw[k] = d[k * 4] * 256 + d[k * 4 + 1] + d[k * 4 + 2] / 256 - 32768;
}
function proceduralHeight(x, z) {
  const nx = (x + 9000) / 2600, nz = (z + 4000) / 2600;
  const ridged = 1 - Math.abs(2 * fbm(nx * 1.6, nz * 1.6, 4) - 1);
  let h = 300 + 480 * fbm(nx, nz, 6) + 170 * ridged * ridged;
  const curve = 1900 * Math.sin(x / 2600) + 1700;
  const dv = Math.abs(z - curve);
  h -= 170 * Math.exp(-((dv / 850) ** 2));
  return h;
}
function fillProcedural() {
  for (let j = 0; j < RAW; j++) for (let i = 0; i < RAW; i++) {
    const x = (i + 0.5) / RAW * SIZE - HALF, z = (j + 0.5) / RAW * SIZE - HALF;
    raw[j * RAW + i] = proceduralHeight(x, z);
  }
}
function sampleRaw(x, z) {
  const u = Math.min(RAW - 1.001, Math.max(0, (x + HALF) / SIZE * RAW - 0.5));
  const v = Math.min(RAW - 1.001, Math.max(0, (z + HALF) / SIZE * RAW - 0.5));
  const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j;
  const a = raw[j * RAW + i], b = raw[j * RAW + i + 1], c = raw[(j + 1) * RAW + i], d = raw[(j + 1) * RAW + i + 1];
  return a + (b - a) * fu + (c - a) * fv + (a - b - c + d) * fu * fv;
}

/* grille du maillage: le sol pour marcher suit exactement ces sommets */
const G = 385;
const grid = new Float32Array(G * G);
function groundAt(x, z) {
  const u = Math.min(G - 1.001, Math.max(0, (x + HALF) / SIZE * (G - 1)));
  const v = Math.min(G - 1.001, Math.max(0, (z + HALF) / SIZE * (G - 1)));
  const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j;
  const a = grid[j * G + i], b = grid[j * G + i + 1], c = grid[(j + 1) * G + i], d = grid[(j + 1) * G + i + 1];
  return a + (b - a) * fu + (c - a) * fv + (a - b - c + d) * fu * fv;
}
function slopeAt(x, z) {
  const dx = (groundAt(x + 8, z) - groundAt(x - 8, z)) / 16, dz = (groundAt(x, z + 8) - groundAt(x, z - 8)) / 16;
  return Math.hypot(dx, dz);
}

/* ---------- 2. Imagerie ---------- */
const IMZ = 15, IMN = N * 4, IMPX = IMN * 256;
let imageCanvas = null;
async function loadImagery() {
  const cv = document.createElement('canvas'); cv.width = cv.height = IMPX;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let ok = 0, fail = 0;
  const list = [];
  for (let j = 0; j < IMN; j++) for (let i = 0; i < IMN; i++) list.push([i, j]);
  async function worker() {
    while (list.length) {
      const [i, j] = list.shift();
      const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${IMZ}/${y0 * 4 + j}/${x0 * 4 + i}`;
      try { const im = await loadImg(url, 8000); ctx.drawImage(im, i * 256, j * 256); ok++; } catch { fail++; if (fail > 6 && ok === 0) { list.length = 0; } }
    }
  }
  await Promise.all(Array.from({ length: 10 }, worker));
  if (ok < IMN * IMN * 0.7) throw new Error('imagery');
  imageCanvas = cv;
}
function proceduralTexture() {
  const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(S, S); const d = img.data;
  const pal = {
    wheat: [196, 176, 120], green: [118, 138, 74], plough: [150, 118, 82],
    scrub: [104, 118, 66], soil: [164, 136, 98], rock: [140, 132, 120], olive: [86, 100, 58]
  };
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const x = (i + 0.5) / S * SIZE - HALF, z = (j + 0.5) / S * SIZE - HALF;
    const h = groundAt(x, z), sl = slopeAt(x, z);
    const cellX = Math.floor((x + 20000) / 140), cellZ = Math.floor((z + 20000) / 110);
    const parcel = hash(cellX, cellZ), grain = fbm(x / 60, z / 60, 3);
    let c;
    if (sl > 0.55) c = pal.rock;
    else if (sl < 0.16 && h < 600) c = parcel < 0.4 ? pal.wheat : parcel < 0.7 ? pal.green : pal.plough;
    else c = grain > 0.52 ? pal.olive : grain > 0.45 ? pal.scrub : pal.soil;
    const k = 0.86 + 0.28 * fbm(x / 25, z / 25, 2);
    const o = (j * S + i) * 4;
    d[o] = c[0] * k; d[o + 1] = c[1] * k; d[o + 2] = c[2] * k; d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ---------- 3. OpenStreetMap ---------- */
async function fetchOSM() {
  const b = `${BBOX.s},${BBOX.w},${BBOX.n},${BBOX.e}`;
  const q = `[out:json][timeout:25];(way["highway"](${b});way["building"](${b});way["waterway"](${b}););out geom;`;
  for (const ep of ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter']) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 25000);
      const r = await fetch(ep, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl.signal });
      clearTimeout(t);
      if (r.ok) return await r.json();
    } catch { /* essaie le miroir suivant */ }
  }
  return null;
}
const ROAD = {
  motorway: [9, 'paved'], trunk: [9, 'paved'], primary: [8, 'paved'], secondary: [7, 'paved'], tertiary: [6, 'paved'],
  unclassified: [5, 'paved'], residential: [5, 'paved'], service: [4, 'paved'], track: [3.5, 'track'],
  path: [1.6, 'path'], footway: [1.6, 'path'], bridleway: [1.8, 'path'], steps: [1.6, 'path']
};
const COLORS = { paved: '#4b4a47', track: '#a4835a', path: '#b99c72', river: '#4f7f9a', stream: '#5b8aa3' };

/* ---------- Monde procédural (si pas de données OSM) ---------- */
function proceduralWorld() {
  const roads = [], houses = [];
  const main = [], sec = [];
  for (let x = -HALF; x <= HALF; x += 50) main.push([x, SPAWN_Z + 700 * Math.sin((x - SPAWN_X) / 1700) + 40 * Math.sin(x / 210)]);
  for (let z = -HALF; z <= HALF; z += 50) sec.push([SPAWN_X + 500 * Math.sin((z - SPAWN_Z) / 1300) + 30 * Math.sin(z / 170), z]);
  roads.push({ pts: main, w: 7, kind: 'paved' }, { pts: sec, w: 5.5, kind: 'paved' });
  const douars = [[SPAWN_X, SPAWN_Z, 70, 260]];
  let tries = 0;
  while (douars.length < 11 && tries++ < 400) {
    const x = SPAWN_X + (rng() - 0.5) * 9000, z = SPAWN_Z + (rng() - 0.5) * 9000;
    if (Math.abs(x) > HALF - 300 || Math.abs(z) > HALF - 300 || slopeAt(x, z) > 0.22) continue;
    if (douars.some(d => Math.hypot(d[0] - x, d[1] - z) < 1300)) continue;
    douars.push([x, z, 12 + Math.floor(rng() * 22), 110 + rng() * 90]);
  }
  douars.slice(1).forEach(([x, z]) => {
    const src = rng() < 0.5 ? main : sec;
    let best = src[0], bd = Infinity;
    for (const p of src) { const dd = Math.hypot(p[0] - x, p[1] - z); if (dd < bd) { bd = dd; best = p; } }
    const mx = (best[0] + x) / 2 + (rng() - 0.5) * bd * 0.35, mz = (best[1] + z) / 2 + (rng() - 0.5) * bd * 0.35;
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(best[0], 0, best[1]), new THREE.Vector3(mx, 0, mz), new THREE.Vector3(x, 0, z)]);
    roads.push({ pts: curve.getPoints(Math.max(6, Math.round(bd / 40))).map(p => [p.x, p.z]), w: 3.5, kind: 'track' });
  });
  douars.forEach(([cx, cz, count, radius], di) => {
    for (let k = 0; k < count; k++) {
      const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * radius;
      const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      if (slopeAt(x, z) > 0.4) continue;
      const w = 8 + rng() * 8, dpt = 7 + rng() * 5, ang = rng() * Math.PI;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const poly = [[-w / 2, -dpt / 2], [w / 2, -dpt / 2], [w / 2, dpt / 2], [-w / 2, dpt / 2]].map(([u, v]) => [x + u * ca - v * sa, z + u * sa + v * ca]);
      houses.push({ poly, h: rng() < 0.65 ? 3.4 : 6.4 });
    }
    if (di === 0) { // mosquée et minaret au centre
      const mx = SPAWN_X + 60, mz = SPAWN_Z - 40;
      houses.push({ poly: [[mx - 14, mz - 10], [mx + 14, mz - 10], [mx + 14, mz + 10], [mx - 14, mz + 10]], h: 6, color: '#f4f2ec' });
      houses.push({ poly: [[mx + 14, mz - 10], [mx + 18, mz - 10], [mx + 18, mz - 6], [mx + 14, mz - 6]], h: 19, color: '#f4f2ec' });
    }
  });
  return { roads, houses, water: [] };
}
function clipLine(pts) { // garde seulement les morceaux dans la zone
  const inside = p => Math.abs(p[0]) < HALF + 50 && Math.abs(p[1]) < HALF + 50;
  const parts = []; let cur = [];
  for (const p of pts) { if (inside(p)) cur.push(p); else { if (cur.length > 1) parts.push(cur); cur = []; } }
  if (cur.length > 1) parts.push(cur);
  return parts;
}
function osmWorld(data) {
  const roads = [], houses = [], water = [];
  for (const el of data.elements || []) {
    if (el.type !== 'way' || !el.geometry) continue;
    const pts = el.geometry.filter(g => g && isFinite(g.lat) && isFinite(g.lon)).map(g => geoToWorld(g.lat, g.lon));
    if (pts.length < 2) continue;
    const t = el.tags || {};
    if (t.building) {
      if (pts.length > 3 && pts[0][0] === pts.at(-1)[0] && pts[0][1] === pts.at(-1)[1]) pts.pop();
      if (pts.length < 3 || pts.some(p => Math.abs(p[0]) > HALF || Math.abs(p[1]) > HALF)) continue;
      const lv = parseFloat(t['building:levels']);
      houses.push({ poly: pts, h: lv > 0 ? lv * 3.1 : (rng() < 0.6 ? 3.4 : 6.4) });
    } else if (t.highway) {
      const spec = ROAD[t.highway] || [3, 'track'];
      const paved = t.surface && /asphalt|paved|concrete/.test(t.surface);
      const kind = paved ? 'paved' : (t.surface && /unpaved|dirt|ground|gravel|earth/.test(t.surface) ? 'track' : spec[1]);
      for (const part of clipLine(pts)) roads.push({ pts: part, w: spec[0], kind });
    } else if (t.waterway) {
      for (const part of clipLine(pts)) water.push({ pts: part, w: t.waterway === 'river' ? 10 : 3, kind: t.waterway === 'river' ? 'river' : 'stream' });
    }
  }
  return { roads, houses, water };
}

/* ---------- Construction 3D ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const SKY = new THREE.Color('#b9cfe0');
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 2500, 15000);
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 40000);
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x6b5a40, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.9); sun.position.set(-4000, 6000, 2500); scene.add(sun);

let terrainMesh;
function buildTerrain(texCanvas) {
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, G - 1, G - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let k = 0; k < pos.count; k++) {
    const x = pos.getX(k), z = pos.getZ(k);
    const h = sampleRaw(x, z);
    pos.setY(k, h);
    const i = Math.round((x + HALF) / SIZE * (G - 1)), j = Math.round((z + HALF) / SIZE * (G - 1));
    grid[j * G + i] = h;
  }
  geo.computeVertexNormals();
  const tex = new THREE.CanvasTexture(texCanvas || proceduralTexture());
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  terrainMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex }));
  scene.add(terrainMesh);
}
function prepGrid() { // la grille doit exister avant la texture procédurale
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) grid[j * G + i] = sampleRaw(i / (G - 1) * SIZE - HALF, j / (G - 1) * SIZE - HALF);
}

function buildRibbons(list, lift) {
  const P = [], C = [], I = [];
  const col = new THREE.Color();
  for (const r of list) {
    if (r.pts.length < 2) continue;
    const dense = [];
    for (let k = 0; k < r.pts.length - 1; k++) {
      const [ax, az] = r.pts[k], [bx, bz] = r.pts[k + 1];
      const L = Math.hypot(bx - ax, bz - az), s = Math.max(1, Math.ceil(L / 6));
      for (let q = 0; q < s; q++) dense.push([ax + (bx - ax) * q / s, az + (bz - az) * q / s]);
    }
    dense.push(r.pts.at(-1));
    col.set(COLORS[r.kind]);
    const base = P.length / 3;
    for (let k = 0; k < dense.length; k++) {
      const a = dense[Math.max(0, k - 1)], b = dense[Math.min(dense.length - 1, k + 1)];
      let dx = b[0] - a[0], dz = b[1] - a[1]; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
      const nx = -dz * r.w / 2, nz = dx * r.w / 2;
      const [x, z] = dense[k];
      const lx = x + nx, lz = z + nz, rx = x - nx, rz = z - nz;
      P.push(lx, groundAt(lx, lz) + lift, lz, rx, groundAt(rx, rz) + lift, rz);
      C.push(col.r, col.g, col.b, col.r, col.g, col.b);
      if (k > 0) { const o = base + (k - 1) * 2; I.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
    }
  }
  if (!P.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  g.setIndex(I); g.computeVertexNormals();
  const m = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
  scene.add(new THREE.Mesh(g, m));
}

const WALLS = ['#f0ebe1', '#e8dfcf', '#f4f2ed', '#dccdb4', '#e2e7e6', '#cfe0ec'];
function buildHouses(list) {
  const geos = []; const col = new THREE.Color();
  for (const b of list) try {
    if (!b.poly || b.poly.length < 3 || b.poly.some(p => !isFinite(p[0]) || !isFinite(p[1]))) continue;
    let lo = Infinity, hi = -Infinity;
    for (const [x, z] of b.poly) { const g = groundAt(x, z); lo = Math.min(lo, g); hi = Math.max(hi, g); }
    const shape = new THREE.Shape(b.poly.map(([x, z]) => new THREE.Vector2(x, -z)));
    const base = lo - 1, top = hi + b.h;
    const geo = new THREE.ExtrudeGeometry(shape, { depth: top - base, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2); geo.translate(0, base, 0);
    const ng = geo.index ? geo.toNonIndexed() : geo;
    col.set(b.color || WALLS[Math.floor(rng() * WALLS.length)]);
    const c = new Float32Array(ng.attributes.position.count * 3);
    for (let k = 0; k < c.length; k += 3) { c[k] = col.r; c[k + 1] = col.g; c[k + 2] = col.b; }
    ng.setAttribute('color', new THREE.BufferAttribute(c, 3));
    for (const key of Object.keys(ng.attributes)) if (!['position', 'normal', 'color'].includes(key)) ng.deleteAttribute(key);
    if (ng.attributes.position.count) geos.push(ng);
  } catch (e) { /* bâtiment mal formé: on l'ignore */ }
  if (!geos.length) return;
  const merged = mergeGeometries(geos);
  if (!merged) throw new Error('merge failed');
  scene.add(new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true })));
}

function buildTrees(roads) {
  const spots = [];
  const MAX = 9000;
  if (imageCanvas) {
    const S = IMPX, d = imageCanvas.getContext('2d').getImageData(0, 0, S, S).data;
    for (let t = 0; t < 120000 && spots.length < MAX; t++) {
      const px = Math.floor(rng() * S), py = Math.floor(rng() * S), o = (py * S + px) * 4;
      const r = d[o], g = d[o + 1], b = d[o + 2];
      if (g > r + 3 && g >= b - 4 && r + g + b < 300 && r + g + b > 60)
        spots.push([(px + 0.5) / S * SIZE - HALF, (py + 0.5) / S * SIZE - HALF]);
    }
  } else {
    for (let t = 0; t < 80000 && spots.length < MAX; t++) {
      const x = (rng() - 0.5) * SIZE, z = (rng() - 0.5) * SIZE;
      if (fbm(x / 400, z / 400, 3) < 0.53 || slopeAt(x, z) > 0.6) continue;
      spots.push([x, z]);
    }
  }
  const nearRoad = (x, z) => false; // route trop fine pour un test coûteux; les arbres restent plausibles
  const trunkG = new THREE.CylinderGeometry(0.22, 0.34, 1, 5); trunkG.translate(0, 0.5, 0);
  const crownG = new THREE.IcosahedronGeometry(1, 1);
  const trunks = new THREE.InstancedMesh(trunkG, new THREE.MeshLambertMaterial({ color: '#5a4632' }), spots.length);
  const crowns = new THREE.InstancedMesh(crownG, new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true }), spots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  const greens = ['#56663a', '#4b5f31', '#647343', '#3e5230', '#6b7748'];
  spots.forEach(([x, z], k) => {
    if (nearRoad(x, z)) return;
    const y = groundAt(x, z), sc = 0.7 + rng() * 0.9, th = 1.6 * sc;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rng() * 6.28);
    m.compose(p.set(x, y - 0.2, z), q, s.set(sc, th, sc)); trunks.setMatrixAt(k, m);
    m.compose(p.set(x, y + th + 1.4 * sc, z), q, s.set(2.6 * sc, 2.1 * sc, 2.6 * sc)); crowns.setMatrixAt(k, m);
    crowns.setColorAt(k, c.set(greens[Math.floor(rng() * greens.length)]));
  });
  scene.add(trunks, crowns);
}

/* ---------- Contrôles ---------- */
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.maxPolarAngle = 1.48; orbit.minDistance = 40; orbit.maxDistance = 16000;
let mode = 'fly';
const walker = { x: SPAWN_X, z: SPAWN_Z, yaw: 0, pitch: -0.05, y: 0 };
const keys = new Set();
const joyVec = { x: 0, y: 0 };
const isTouch = matchMedia('(pointer: coarse)').matches;

function setHome() {
  const g = groundAt(SPAWN_X, SPAWN_Z);
  orbit.target.set(SPAWN_X, g, SPAWN_Z);
  camera.position.set(SPAWN_X + 1700, g + 1400, SPAWN_Z + 2100);
  orbit.update();
}
function setMode(m) {
  mode = m;
  document.getElementById('b-fly').setAttribute('aria-pressed', m === 'fly');
  document.getElementById('b-walk').setAttribute('aria-pressed', m === 'walk');
  document.getElementById('joy').hidden = !(m === 'walk' && isTouch);
  if (m === 'walk') {
    orbit.enabled = false;
    walker.x = orbit.target.x; walker.z = orbit.target.z;
    const dx = orbit.target.x - camera.position.x, dz = orbit.target.z - camera.position.z;
    walker.yaw = Math.atan2(-dx, -dz); walker.pitch = -0.05;
    walker.y = groundAt(walker.x, walker.z) + 1.7;
    camera.rotation.order = 'YXZ';
  } else {
    orbit.enabled = true;
    const g = groundAt(walker.x, walker.z);
    orbit.target.set(walker.x, g, walker.z);
    camera.position.set(walker.x + Math.sin(walker.yaw) * 500, g + 380, walker.z + Math.cos(walker.yaw) * 500);
    orbit.update();
  }
  document.getElementById('help').textContent = m === 'fly'
    ? 'اسحب باش تدور · العجلة للتقريب · ضغطتين على الأرض باش تنزل تمشي'
    : (isTouch ? 'الدائرة للمشي · اسحب فالشاشة باش تشوف' : 'W A S D أو الأسهم للمشي · Shift للجري · اسحب باش تشوف');
}
document.getElementById('b-fly').onclick = () => setMode('fly');
document.getElementById('b-walk').onclick = () => setMode('walk');
document.getElementById('b-home').onclick = () => { if (mode === 'walk') { walker.x = SPAWN_X; walker.z = SPAWN_Z; } else setHome(); };

addEventListener('keydown', e => { keys.add(e.code); });
addEventListener('keyup', e => { keys.delete(e.code); });
let look = null;
canvas.addEventListener('pointerdown', e => { if (mode === 'walk') { look = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove', e => {
  if (!look || e.pointerId !== look.id) return;
  walker.yaw -= (e.clientX - look.x) * 0.0045; walker.pitch -= (e.clientY - look.y) * 0.0045;
  walker.pitch = Math.max(-1.35, Math.min(1.35, walker.pitch)); look.x = e.clientX; look.y = e.clientY;
});
canvas.addEventListener('pointerup', () => { look = null; });
canvas.addEventListener('pointercancel', () => { look = null; });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('dblclick', e => {
  if (mode !== 'fly' || !terrainMesh) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(terrainMesh)[0];
  if (hit) { orbit.target.copy(hit.point); setMode('walk'); }
});
const joy = document.getElementById('joy'), knob = joy.querySelector('i');
let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moveJoy(e); e.stopPropagation(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
const endJoy = () => { joyId = null; joyVec.x = joyVec.y = 0; knob.style.transform = ''; };
joy.addEventListener('pointerup', endJoy); joy.addEventListener('pointercancel', endJoy);
function moveJoy(e) {
  const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const l = Math.hypot(dx, dy), max = r.width / 2 - 24; if (l > max) { dx *= max / l; dy *= max / l; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`; joyVec.x = dx / max; joyVec.y = dy / max;
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* ---------- HUD ---------- */
function setSources() {
  const label = { real: 'حقيقية', approx: 'تقريبية', off: 'ما توصلناش بيها' };
  const rows = [
    ['التضاريس', status.terrain, status.terrain === 'real' ? 'حقيقية · AWS Terrain' : 'تقريبية (مولّدة)'],
    ['الصور الجوية', status.image, status.image === 'real' ? 'حقيقية · Esri' : 'ألوان مولّدة'],
    ['الطرقات والمنازل', status.osm, status.osm === 'real'
      ? `OSM · ${status.roads} طريق · ${status.houses} بناية`
      : `مولّدة للتوضيح · ${status.houses} دار`]
  ];
  document.getElementById('sources').innerHTML = rows.map(([k, st, txt]) =>
    `<div class="src"><span class="dot ${st}"></span><span>${k}: ${txt}</span></div>`).join('');
  void label;
  document.getElementById('r-area').textContent = `${(SIZE / 1000).toFixed(1)} × ${(SIZE / 1000).toFixed(1)} km`;
  const credit = [];
  if (status.terrain === 'real') credit.push('Terrain: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">Mapzen / AWS</a>');
  if (status.image === 'real') credit.push('Imagery: Esri, Maxar, Earthstar Geographics');
  if (status.osm === 'real') credit.push('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');
  document.getElementById('credit').innerHTML = credit.join(' · ');
  const nt = document.getElementById('notice');
  if (status.terrain !== 'real' || status.osm !== 'real') {
    nt.hidden = false;
    nt.innerHTML = status.terrain !== 'real'
      ? `<strong>هادي معاينة تقريبية.</strong> الصفحة هنا ما عندهاش الحق تجيب المعطيات من الأنترنت، داكشي علاش التضاريس والدواوير مولّدين. حط نفس الملف على GitHub Pages وغادي يجيب التضاريس الحقيقية ديال امزفرون والصور الجوية وطرقات OpenStreetMap.<br><button id="nt-x">خبّي</button>`
      : `<strong>الطرقات والمنازل ما وصلوش من OpenStreetMap.</strong> التضاريس والصور حقيقية. عاود حمّل الصفحة من بعد شوية.<br><button id="nt-x">خبّي</button>`;
    document.getElementById('nt-x').onclick = () => { nt.hidden = true; };
  } else if (status.houses < 30) {
    nt.hidden = false;
    nt.innerHTML = `<strong>المنازل قلال فـ OpenStreetMap هنا (${status.houses}).</strong> تقدر تزيدهم فـ openstreetmap.org وغادي يبانو هنا أوتوماتيكيا.<br><button id="nt-x">خبّي</button>`;
    document.getElementById('nt-x').onclick = () => { nt.hidden = true; };
  }
}
const rc = document.getElementById('r-coord'), ra = document.getElementById('r-alt');
let hudT = 0;
function updateHud(t) {
  if (t - hudT < 150) return; hudT = t;
  const x = mode === 'walk' ? walker.x : orbit.target.x, z = mode === 'walk' ? walker.z : orbit.target.z;
  const g = worldToGeo(x, z);
  rc.textContent = `${g.lat.toFixed(4)}° N, ${Math.abs(g.lon).toFixed(4)}° W`;
  ra.textContent = `${Math.round(groundAt(x, z))} m`;
}

/* ---------- Boucle ---------- */
const clock = new THREE.Clock();
function tick(t) {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'walk') {
    let f = 0, r = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) r += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) r -= 1;
    if (keys.has('KeyQ')) walker.yaw += 1.6 * dt;
    if (keys.has('KeyE')) walker.yaw -= 1.6 * dt;
    f -= joyVec.y; r += joyVec.x;
    const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(joyVec.x, joyVec.y) > 0.95) ? 22 : 6;
    const sy = Math.sin(walker.yaw), cy = Math.cos(walker.yaw);
    walker.x += (-sy * f + cy * r) * speed * dt;
    walker.z += (-cy * f - sy * r) * speed * dt;
    walker.x = Math.max(-HALF + 20, Math.min(HALF - 20, walker.x));
    walker.z = Math.max(-HALF + 20, Math.min(HALF - 20, walker.z));
    const target = groundAt(walker.x, walker.z) + 1.7;
    walker.y += (target - walker.y) * Math.min(1, dt * 12);
    camera.position.set(walker.x, walker.y, walker.z);
    camera.rotation.set(walker.pitch, walker.yaw, 0, 'YXZ');
  } else {
    orbit.update();
    const g = groundAt(camera.position.x, camera.position.z);
    if (camera.position.y < g + 25) camera.position.y = g + 25;
  }
  updateHud(t);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------- Démarrage ---------- */
(async function start() {
  resize();
  try { await loadTerrain(); status.terrain = 'real'; } catch { fillProcedural(); }
  step('st-terrain', 'done'); step('st-image', 'now');
  if (status.terrain === 'real') { try { await loadImagery(); status.image = 'real'; } catch { imageCanvas = null; } }
  step('st-image', 'done'); step('st-osm', 'now');
  let world = null;
  if (status.terrain === 'real') {
    const data = await fetchOSM();
    if (data) { world = osmWorld(data); status.osm = 'real'; }
  }
  step('st-osm', 'done'); step('st-build', 'now');
  const log = document.getElementById('buildlog');
  const pause = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  const errors = [];
  async function safe(name, fn) {
    const li = document.createElement('li'); li.className = 'now'; li.textContent = name; log.appendChild(li);
    await pause();
    const t0 = performance.now();
    try { fn(); li.className = 'done'; li.textContent = `${name} · ${((performance.now() - t0) / 1000).toFixed(1)}s`; }
    catch (e) { console.error(name, e); errors.push(`${name}: ${e.message}`); li.className = ''; li.textContent = `✗ ${name}: ${e.message}`; }
    console.log('[mzefroune3d]', li.textContent);
  }
  await safe('grid', () => prepGrid());
  await safe('terrain', () => buildTerrain(imageCanvas));
  if (!terrainMesh) await safe('terrain-fallback', () => { imageCanvas = null; buildTerrain(null); });
  if (!world) world = proceduralWorld();
  status.roads = world.roads.length; status.houses = world.houses.length;
  console.log('[mzefroune3d] roads', world.roads.length, 'houses', world.houses.length, 'water', world.water.length);
  await safe(`water (${world.water.length})`, () => buildRibbons(world.water, 0.5));
  await safe(`roads (${world.roads.length})`, () => buildRibbons(world.roads, 0.7));
  await safe(`houses (${world.houses.length})`, () => buildHouses(world.houses));
  await safe('trees', () => buildTrees(world.roads));
  await safe('view', () => { setHome(); setMode('fly'); setSources(); });
  step('st-build', 'done');
  await pause();
  document.getElementById('loader').hidden = true;
  if (errors.length) {
    const nt = document.getElementById('notice'); nt.hidden = false;
    nt.innerHTML = `<strong>شي أجزاء ما تبناوش:</strong><br><span style="direction:ltr;display:block;font-size:11px">${errors.join('<br>')}</span><button id="nt-x">خبّي</button>`;
    document.getElementById('nt-x').onclick = () => { nt.hidden = true; };
  }
  requestAnimationFrame(tick);
})().catch(e => {
  console.error(e);
  const b = document.querySelector('#loader .box');
  b.insertAdjacentHTML('beforeend', `<p style="color:#e8b866;font-size:13px;direction:ltr">Erreur: ${e.message}</p>`);
});
</script>
